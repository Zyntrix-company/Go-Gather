name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Vite app
      working-directory: ./frontend
      run: npm run build

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Deploy to S3
      run: |
        # index.html — never cache so users always get fresh JS/CSS hashes
        aws s3 cp frontend/dist/index.html s3://gatherrgo-frontend/index.html \
          --content-type "text/html; charset=utf-8" \
          --cache-control "no-cache, no-store, must-revalidate" \
          --metadata-directive REPLACE

        # Hashed JS/CSS assets — cache for 1 year (filename changes every build)
        aws s3 sync frontend/dist/assets s3://gatherrgo-frontend/assets \
          --cache-control "public, max-age=31536000, immutable" \
          --delete

        # sitemap.xml — S3 defaults to octet-stream for .xml; must be set explicitly
        aws s3 cp frontend/dist/sitemap.xml s3://gatherrgo-frontend/sitemap.xml \
          --content-type "application/xml" \
          --cache-control "public, max-age=3600" \
          --metadata-directive REPLACE

        # robots.txt
        aws s3 cp frontend/dist/robots.txt s3://gatherrgo-frontend/robots.txt \
          --content-type "text/plain; charset=utf-8" \
          --cache-control "public, max-age=3600" \
          --metadata-directive REPLACE

        # Static images — 24 h cache (no content hash, may change between deploys)
        for file in og-image.png apple-touch-icon.png favicon.ico logo.png; do
          if [ -f "frontend/dist/$file" ]; then
            aws s3 cp "frontend/dist/$file" "s3://gatherrgo-frontend/$file" \
              --content-type "image/png" \
              --cache-control "public, max-age=86400" \
              --metadata-directive REPLACE
          fi
        done

        aws s3 cp frontend/dist/favicon.svg s3://gatherrgo-frontend/favicon.svg \
          --content-type "image/svg+xml" \
          --cache-control "public, max-age=86400" \
          --metadata-directive REPLACE

        # Everything else (fonts, manifests, etc.)
        aws s3 sync frontend/dist s3://gatherrgo-frontend \
          --exclude "index.html" \
          --exclude "assets/*" \
          --exclude "sitemap.xml" \
          --exclude "robots.txt" \
          --exclude "og-image.png" \
          --exclude "apple-touch-icon.png" \
          --exclude "favicon.ico" \
          --exclude "favicon.svg" \
          --exclude "logo.png" \
          --cache-control "public, max-age=86400" \
          --delete

        # Remove raw design-export files (Vite copies all of /public; these aren't meant to be served)
        aws s3 rm "s3://gatherrgo-frontend/Frame 84.png" --quiet || true
        aws s3 rm "s3://gatherrgo-frontend/Frame 85.png" --quiet || true

    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation \
          --distribution-id ${{ secrets.CLOUDFRONT_FRONTEND_DISTRIBUTION_ID }} \
          --paths "/index.html" "/robots.txt" "/sitemap.xml" "/*.png" "/*.ico" "/*.svg"
