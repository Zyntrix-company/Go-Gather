name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./frontend
      run: npm install

    - name: Build Vite app
      working-directory: ./frontend
      run: npm run build

    - name: Write SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.EC2_FRONTEND_SSH_KEY }}" > ~/.ssh/frontend_key
        chmod 600 ~/.ssh/frontend_key
        ssh-keyscan -H ${{ secrets.EC2_FRONTEND_HOST }} >> ~/.ssh/known_hosts

    - name: Copy dist to EC2 via rsync
      run: |
        rsync -az --delete \
          -e "ssh -i ~/.ssh/frontend_key -o StrictHostKeyChecking=no" \
          frontend/dist/ \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONTEND_HOST }}:/home/ubuntu/Go-Gather/frontend/dist/

    - name: Reload Nginx
      run: |
        ssh -i ~/.ssh/frontend_key -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USER }}@${{ secrets.EC2_FRONTEND_HOST }} \
          "sudo systemctl reload nginx"
