name: App CI

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: app/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Ratchet: main already had 51 type errors when this check was added (Nov 2026),
    # all in existing screens/components. Fail if the count goes UP; lower
    # TSC_ERROR_BASELINE whenever errors are fixed, until it reaches 0 and this
    # becomes a plain `npx tsc --noEmit`.
    - name: Type check (tsc --noEmit, no new errors)
      env:
        TSC_ERROR_BASELINE: '51'
      run: |
        set +e
        npx --no-install tsc --noEmit > tsc-output.txt 2>&1
        TSC_EXIT=$?
        set -e
        COUNT=$(grep -c 'error TS' tsc-output.txt || true)
        if [ "$TSC_EXIT" -ne 0 ] && [ "$COUNT" -eq 0 ]; then
          cat tsc-output.txt
          echo "::error::tsc failed to run (exit $TSC_EXIT) without reporting type errors"
          exit 1
        fi
        echo "TypeScript errors: $COUNT (baseline $TSC_ERROR_BASELINE)"
        if [ "$COUNT" -gt "$TSC_ERROR_BASELINE" ]; then
          cat tsc-output.txt
          echo "::error::TypeScript errors went up from $TSC_ERROR_BASELINE to $COUNT"
          exit 1
        fi

    # TODO: __tests__/App.test.tsx is skipped because native modules
    # (react-native-gesture-handler, etc.) are not mocked in the Jest setup.
    # Remove the ignore once a jest setup file provides those mocks.
    - name: Unit tests (jest)
      run: npx jest --ci --testPathIgnorePatterns '__tests__/App\.test\.tsx$'
