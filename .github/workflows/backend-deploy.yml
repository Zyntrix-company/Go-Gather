name: Deploy Backend

on:
  push:
    branches:
      - main
    # 🎯 Only trigger if files in the backend folder change
    # paths:
    #   - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 🎯 Context for monorepo
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build Docker image
      run: |
        ls 
        docker build -t backend-api .

    - name: Tag Docker image
      run: |
        docker tag backend-api:latest 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Push Docker image to ECR
      run: |
        docker push 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Login to ECR from EC2
          aws ecr get-login-password --region ap-south-1 | sudo docker login --username AWS --password-stdin 092201262561.dkr.ecr.ap-south-1.amazonaws.com
          cd /home/ubuntu/Go-Gather/backend
          # Pull latest image
          sudo docker pull 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # Force remove old container
          sudo docker kill --signal=SIGKILL gathergo-container || true
          sudo docker rm -f gathergo-container || true

          # Run new container
          sudo docker run -d \
          --name gathergo-container \
          -p 3000:3000 \
          --env-file .env \
            092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}
