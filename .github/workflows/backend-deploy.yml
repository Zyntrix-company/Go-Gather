name: Deploy Backend

on:
  push:
    branches:
      - main
    # 🎯 Only trigger if files in the backend folder change
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 🎯 Context for monorepo
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build Docker image
      run: |
        docker build -t backend-api ./backend

    - name: Tag Docker image
      run: |
        docker tag backend-api:latest 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:latest

    - name: Push Docker image to ECR
      run: |
        docker push 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:latest
