name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image to ECR
      run: |
        docker build -t backend-api .
        docker tag backend-api:latest 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}
        docker push 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        request_pty: true
        script: |
          set -e

          # ── 1. ECR Login ───────────────────────────────────────────────────────
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin 092201262561.dkr.ecr.ap-south-1.amazonaws.com

          # ── 2. Pull new image ──────────────────────────────────────────────────
          docker pull 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # ── 3. Remove old container ────────────────────────────────────────────
          # NOTE: docker stop/kill are broken on kernel 6.17 + cgroup v2 + Docker 28.
          # The only working approach is to kill the container process directly,
          # then let docker rm clean up the metadata.
          if docker ps -a --format '{{.Names}}' | grep -q '^gathergo-container$'; then
            CPID=$(docker inspect --format '{{.State.Pid}}' gathergo-container 2>/dev/null || echo "0")
            if [ -n "$CPID" ] && [ "$CPID" != "0" ]; then
              echo "Killing container process PID=$CPID"
              sudo kill -9 "$CPID" || true
              sleep 3
            fi
            docker rm gathergo-container 2>/dev/null || true
          fi

          # ── 4. Verify clean slate ──────────────────────────────────────────────
          if docker ps -a --format '{{.Names}}' | grep -q '^gathergo-container$'; then
            echo "ERROR: container still exists after cleanup"
            docker inspect gathergo-container --format 'Status={{.State.Status}} Pid={{.State.Pid}}' || true
            exit 1
          fi

          # ── 5. Start new container ─────────────────────────────────────────────
          cd /home/ubuntu/Go-Gather/backend
          docker run -d \
            --name gathergo-container \
            --restart unless-stopped \
            -p 3000:3000 \
            --env-file .env \
            092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # ── 6. Confirm running ─────────────────────────────────────────────────
          sleep 3
          docker ps --filter name=gathergo-container --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
