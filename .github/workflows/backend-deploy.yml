name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image to ECR
      run: |
        docker build -t backend-api .
        docker tag backend-api:latest 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}
        docker push 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        BREVO_FROM_EMAIL: ${{ secrets.BREVO_FROM_EMAIL }}
        BREVO_FROM_NAME: ${{ secrets.BREVO_FROM_NAME }}
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        request_pty: true
        envs: FIREBASE_SERVICE_ACCOUNT_B64,BREVO_API_KEY,BREVO_FROM_EMAIL,BREVO_FROM_NAME
        script: |
          set -e

          # ── 1. ECR Login ───────────────────────────────────────────────────────
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin 092201262561.dkr.ecr.ap-south-1.amazonaws.com

          # ── 2. Inject Firebase credentials into .env (idempotent) ─────────────
          ENV_FILE=/home/ubuntu/Go-Gather/backend/.env
          # Always remove stale Firebase/Google credential lines first
          sed -i '/^GOOGLE_APPLICATION_CREDENTIALS=/d' "$ENV_FILE" || true
          sed -i '/^FIREBASE_SERVICE_ACCOUNT_B64=/d' "$ENV_FILE" || true
          sed -i '/^FIREBASE_PROJECT_ID=/d' "$ENV_FILE" || true
          if [ -n "$FIREBASE_SERVICE_ACCOUNT_B64" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_B64=$FIREBASE_SERVICE_ACCOUNT_B64" >> "$ENV_FILE"
            echo "FIREBASE_PROJECT_ID=gatherrgo" >> "$ENV_FILE"
            echo "Firebase credentials injected into .env"
          else
            echo "WARNING: FIREBASE_SERVICE_ACCOUNT_B64 secret not set — push notifications disabled"
          fi

          # ── 2b. Ensure admin.gatherrgo.com is in ALLOWED_ORIGINS ─────────────
          CURRENT_ORIGINS=$(grep '^ALLOWED_ORIGINS=' "$ENV_FILE" | cut -d= -f2-)
          if echo "$CURRENT_ORIGINS" | grep -q 'admin.gatherrgo.com'; then
            echo "admin.gatherrgo.com already in ALLOWED_ORIGINS"
          elif [ -z "$CURRENT_ORIGINS" ]; then
            echo 'ALLOWED_ORIGINS=https://gatherrgo.com,https://www.gatherrgo.com,https://admin.gatherrgo.com' >> "$ENV_FILE"
            echo "ALLOWED_ORIGINS created"
          else
            sed -i "s|^ALLOWED_ORIGINS=.*|ALLOWED_ORIGINS=${CURRENT_ORIGINS},https://admin.gatherrgo.com|" "$ENV_FILE"
            echo "admin.gatherrgo.com appended to ALLOWED_ORIGINS"
          fi

          # ── 2c. Google Drive OAuth redirect URI ───────────────────────────────
          DRIVE_REDIRECT='https://api.gatherrgo.com/auth/drive/callback'
          if grep -q '^GOOGLE_DRIVE_REDIRECT_URI=' "$ENV_FILE" 2>/dev/null; then
            sed -i "s|^GOOGLE_DRIVE_REDIRECT_URI=.*|GOOGLE_DRIVE_REDIRECT_URI=${DRIVE_REDIRECT}|" "$ENV_FILE"
            echo "GOOGLE_DRIVE_REDIRECT_URI updated"
          else
            echo "GOOGLE_DRIVE_REDIRECT_URI=${DRIVE_REDIRECT}" >> "$ENV_FILE"
            echo "GOOGLE_DRIVE_REDIRECT_URI added"
          fi

          # ── 2d. Brevo transactional email (provider: src/config/emailProvider.js) ─
          sed -i '/^BREVO_API_KEY=/d' "$ENV_FILE" || true
          sed -i '/^BREVO_FROM_EMAIL=/d' "$ENV_FILE" || true
          sed -i '/^BREVO_FROM_NAME=/d' "$ENV_FILE" || true
          BREVO_FROM_EMAIL="${BREVO_FROM_EMAIL:-Hello@GatherrGo.com}"
          BREVO_FROM_NAME="${BREVO_FROM_NAME:-Gatherrgo}"
          if [ -n "$BREVO_API_KEY" ]; then
            echo "BREVO_API_KEY=$BREVO_API_KEY" >> "$ENV_FILE"
            echo "BREVO_FROM_EMAIL=$BREVO_FROM_EMAIL" >> "$ENV_FILE"
            echo "BREVO_FROM_NAME=$BREVO_FROM_NAME" >> "$ENV_FILE"
            echo "Brevo credentials injected into .env"
          else
            echo "WARNING: BREVO_API_KEY GitHub secret not set — transactional email via Brevo disabled"
          fi

          # ── 3. Free disk space — remove images not used by a running container ──
          docker image prune -af
          docker container prune -f

          # ── 4. Pull new image ──────────────────────────────────────────────────
          docker pull 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # ── 5. Remove old container ────────────────────────────────────────────
          # docker stop/kill are broken on kernel 6.17 + cgroup v2 + Docker 28.
          # Workaround:
          #   1. Disable restart policy FIRST (so Docker won't revive it after kill)
          #   2. Kill the process directly with sudo kill -9
          #   3. docker rm cleans up the metadata
          if docker ps -a --format '{{.Names}}' | grep -q '^gathergo-container$'; then
            echo "Disabling restart policy..."
            docker update --restart=no gathergo-container || true
            CPID=$(docker inspect --format '{{.State.Pid}}' gathergo-container 2>/dev/null || echo "0")
            if [ -n "$CPID" ] && [ "$CPID" != "0" ]; then
              echo "Killing container process PID=$CPID"
              sudo kill -9 "$CPID" || true
              sleep 3
            fi
            docker rm gathergo-container 2>/dev/null || true
          fi

          # ── 6. Verify clean slate ──────────────────────────────────────────────
          if docker ps -a --format '{{.Names}}' | grep -q '^gathergo-container$'; then
            echo "ERROR: container still exists after cleanup"
            docker inspect gathergo-container --format 'Status={{.State.Status}} Pid={{.State.Pid}}' || true
            exit 1
          fi

          # ── 7. Start new container ─────────────────────────────────────────────
          cd /home/ubuntu/Go-Gather/backend
          docker run -d \
            --name gathergo-container \
            --restart unless-stopped \
            -p 3000:3000 \
            --env-file .env \
            092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # ── 8. Confirm running ─────────────────────────────────────────────────
          sleep 3
          docker ps --filter name=gathergo-container --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

          # ── 9. Run pending DB migrations ───────────────────────────────────────
          docker exec gathergo-container node migrations/run.js

          # ── 10. Ensure nginx allows large uploads (50 MB) ──────────────────────
          NGINX_SNIPPET=/etc/nginx/conf.d/upload_limit.conf
          if ! grep -q 'client_max_body_size' "$NGINX_SNIPPET" 2>/dev/null; then
            echo 'client_max_body_size 50M;' | sudo tee "$NGINX_SNIPPET" > /dev/null
            sudo nginx -t && sudo systemctl reload nginx
            echo "nginx upload limit set to 50M"
          else
            echo "nginx upload limit already configured"
          fi
