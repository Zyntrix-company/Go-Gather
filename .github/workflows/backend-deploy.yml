name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image to ECR
      run: |
        docker build -t backend-api .
        docker tag backend-api:latest 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}
        docker push 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        request_pty: true
        script: |
          set -e

          # ── 1. ECR Login ───────────────────────────────────────────────────────
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin 092201262561.dkr.ecr.ap-south-1.amazonaws.com

          # ── 2. Pull new image ──────────────────────────────────────────────────
          docker pull 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # ── 3. Remove old container ────────────────────────────────────────────
          # First attempt: graceful stop then remove (works when user owns the socket)
          docker stop gathergo-container 2>/dev/null || true
          docker rm   gathergo-container 2>/dev/null || true

          # Second attempt: if container is stuck/zombie, restart the Docker daemon.
          # --restart=unless-stopped containers do NOT restart after an explicit stop,
          # so restarting the daemon is safe here — it clears stuck removal states.
          if docker ps -a --format '{{.Names}}' | grep -q '^gathergo-container$'; then
            echo "Container still present — restarting Docker daemon to clear stuck state..."
            sudo systemctl restart docker
            sleep 5
            docker rm gathergo-container 2>/dev/null || true
          fi

          # ── 4. Verify clean slate ──────────────────────────────────────────────
          if docker ps -a --format '{{.Names}}' | grep -q '^gathergo-container$'; then
            echo "=== FATAL: container could not be removed ==="
            docker inspect gathergo-container --format 'Status={{.State.Status}} Pid={{.State.Pid}}' || true
            exit 1
          fi

          # ── 5. Start new container ─────────────────────────────────────────────
          cd /home/ubuntu/Go-Gather/backend
          docker run -d \
            --name gathergo-container \
            --restart unless-stopped \
            -p 3000:3000 \
            --env-file .env \
            092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # ── 6. Confirm running ─────────────────────────────────────────────────
          docker ps --filter name=gathergo-container --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"
