name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image to ECR
      run: |
        docker build -t backend-api .
        docker tag backend-api:latest 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}
        docker push 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Copy compose file to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: backend/docker-compose.ecr.yml
        target: /home/ubuntu/Go-Gather
        strip_components: 1

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        request_pty: true
        script: |
          set -e

          # Login to ECR
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin 092201262561.dkr.ecr.ap-south-1.amazonaws.com

          cd /home/ubuntu/Go-Gather/backend

          # Pull the new image
          docker pull 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # Deploy — docker compose handles stop/remove/start atomically
          BACKEND_IMAGE=092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }} \
          docker compose -f docker-compose.ecr.yml up -d --remove-orphans

          # Verify the container is running
          docker ps --filter name=gathergo-container --format "table {{.Names}}\t{{.Status}}"
