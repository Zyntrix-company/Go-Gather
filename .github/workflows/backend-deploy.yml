name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 🎯 Context for monorepo
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build Docker image
      run: docker build -t backend-api .

    - name: Tag Docker image
      run: |
        docker tag backend-api:latest 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Push Docker image to ECR
      run: |
        docker push 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Login to ECR from EC2
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 092201262561.dkr.ecr.ap-south-1.amazonaws.com
          cd /home/ubuntu/Go-Gather/backend
          # Pull latest image
          docker pull 092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}

          # Stop and remove old container (sudo handles root-owned containers)
          sudo docker stop gathergo-container 2>/dev/null || true
          sudo docker rm -f gathergo-container 2>/dev/null || docker rm -f gathergo-container 2>/dev/null || true

          # Verify container is gone before proceeding
          if docker ps -a --format '{{.Names}}' 2>/dev/null | grep -q '^gathergo-container$'; then
            echo "ERROR: Failed to remove existing container" >&2
            exit 1
          fi

          # Run new container
          docker run -d \
          --name gathergo-container \
          --restart unless-stopped \
          -p 3000:3000 \
          --env-file .env \
            092201262561.dkr.ecr.ap-south-1.amazonaws.com/backend-api:${{ github.sha }}
